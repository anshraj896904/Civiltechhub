name: Build and Release Debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify active Java version
        run: |
          java -version
          javac -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle version
        run: |
          gradle --version

      - name: Generate temporary debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          test -f debug.keystore

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output and prepare release asset
        id: prepare_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            exit 1
          fi
          RELEASE_APK_NAME="app-debug-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          cp "$APK_PATH" "$RELEASE_APK_NAME"
          ls -lh "$APK_PATH" "$RELEASE_APK_NAME"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "release_apk_name=$RELEASE_APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Actions Artifact
        id: upload_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true

      - name: Publish GitHub Release with Debug APK
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_APK_NAME="app-debug-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "release_apk_name=$RELEASE_APK_NAME" >> "$GITHUB_OUTPUT"

          cat <<EOF > release-notes.md
          ### Automated Debug APK Build

          - **Artifact Type:** This is an automatically generated debug APK.
          - **Built By:** The APK was built by GitHub Actions.
          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Intended Purpose:** The APK is intended for testing.
          - **Production Status:** The APK is not a Play Store production release.
          - **Signing Info:** The APK is signed only with a temporary debug keystore.
          EOF

          if ! gh release create "$RELEASE_TAG" "$RELEASE_APK_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            --latest; then
            echo "::warning::Failed to publish GitHub Release ${RELEASE_TAG}. The APK build and Actions artifact (app-debug-apk) succeeded and remain available."
            exit 1
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_APK_NAME="app-debug-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            VERIFIED_ASSET=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[0].name')
            echo "Release publishing succeeded."
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Direct GitHub Release Page URL: $RELEASE_URL"
            echo "Exact APK Asset Filename: ${VERIFIED_ASSET:-$RELEASE_APK_NAME}"
            echo "The APK can be downloaded directly from the release Assets section."
            echo "The normal Actions artifact (app-debug-apk) is also available as a backup."

            {
              echo "## Debug APK Build & Release Summary"
              echo "- **APK Build Status:** Succeeded"
              echo "- **Actions Artifact (\`app-debug-apk\`):** Uploaded (available as a backup)"
              echo "- **Release Status:** Published"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Exact APK Asset Filename:** \`${VERIFIED_ASSET:-$RELEASE_APK_NAME}\`"
              echo "- **Direct GitHub Release Page URL:** ${RELEASE_URL}"
              echo ""
              echo "The APK can be downloaded directly from the release **Assets** section at ${RELEASE_URL}."
              echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup from this workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed. However, the APK build succeeded and the Actions artifact named app-debug-apk remains available."
            echo "WARNING: GitHub Release publishing did not succeed."
            echo "APK Build Status: The APK build succeeded."
            echo "Backup Artifact: The Actions artifact named app-debug-apk remains available for download."

            {
              echo "## Debug APK Build & Release Summary"
              echo "> [!WARNING]"
              echo "> GitHub Release publishing failed, but the APK build and Actions artifact upload succeeded."
              echo ""
              echo "- **APK Build Status:** The APK build succeeded."
              echo "- **Backup Actions Artifact:** The Actions artifact named \`app-debug-apk\` remains available."
              echo "- **Instructions:** Open this workflow run's **Summary** page and download \`app-debug-apk\` under the **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
